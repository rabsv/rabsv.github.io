<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<style>
		#site-main {
			display:    block;
			width:      fit-content;
			margin:     0 auto;
			text-align: center;
		}

		canvas.canv {
			display: block;
			border:  1px solid #aaaaea;

			margin: 0 auto;
			margin-top: 1rem;
			background-color: #fff;
			border-radius: 0.5rem;
		}

		section {
			position: relative;
		}

		.fadeable {
			opacity: 1;
		}

		.fadeable2 {
			opacity: 0;
		}

		.fade {
			opacity: 0;
			transition: opacity 0.7s;
		}

		.fade2 {
			opacity: 1;
			transition: opacity 0.7s;
		}

		.flex p {
			width: 13rem;
			text-align: left;
			margin:     0;
			padding:    0;
		}

		header {
			position: absolute;
			height:   100%;
			width:    100%;
			top:      0;
			left:     0;

			background-color: #f2f2fb;
		}

		div.wave {
			padding:    1rem;
			margin-top: 1rem;

			border:           1px solid #aaaaef;
			background-color: #dfe0f6;

			border-radius: 0.5rem;
		}

		div.wave input.slider {
			margin-left: 1rem;
			width: 100%;
		}

		div.flex {
			display:         flex;
			justify-content: center;
			align-items:     center;
		}

		div.bord {
			margin-left: 0.8rem;
			border-left: 1px solid #aaaaef;
		}

		.controller {
			margin:  0;
			padding: 0;
			width:  2rem;
			height: 2rem;
			display: inline-block;

			border-radius: 100%;

			color:      #FFF;
			cursor:     pointer;
			font-size:  1rem;
			transition: 0.3s;

			border: 0;
		}

		.textline {
			width: 3rem;
			background-color: #f2f2fb;
			border:           1px solid #aaaaea;
		}

		* {
			font-family: sans-serif;
			text-size-adjust: none;
		}

		.controller.ram {
			margin: 0.1rem 0;
			margin-left: 1rem;
			color: #dc2f1f;
			background-color: transparent;
		}

		.controller.toggle {
			background-color: #3584e4;
			color: #fff;
			margin-top: 0.5rem;
		}

		.controller.ram:hover {
			background-color: #dc2f1f;
			color: #fff;
		}

		.controller.toggle:hover {
			color: #3584e4;
			background-color: transparent;
		}

		#add {
			width:      3rem;
			height:     3rem;
			margin-top: 1rem;

			cursor:        pointer;
			font-size:     1.7rem;
			font-weight:   bold;
			border-radius: 100%;
			transition:    0.3s;

			border:           3px solid #3584e4;
			color:            #3584e4;
			background-color: #fff;
		}

		#add:hover {
			border:           0;
			color:            #fff;
			background-color: #3584e4;
		}

		body, html {
			background-color: #f2f2fb;
			margin: 0;
			padding: 0;
		}

		.sum-parent {
			display: block;
			position: sticky;
			top: 0;
			z-index: 1024;
			padding: 0.5rem;
			background-color: #f2f2fb;
			border-bottom:    1px solid #aaaaef;
		}

		#sum {
			margin: 0 auto !important;
		}
	</style>
</head>
<body>
	<main id="site-main">
		<div class="sum-parent">
			<canvas id="sum" width="800px" height="150px" class="canv"></canvas>
			<button class="controller toggle" onclick="toggle(this, null)"><i class="icon fa fa-play fa-sm"></i></button>
		</div>
		<div id="waves"></div>
		<button id="add" onclick="addWave(260, 1)">+</button>
	</main>

	<script src="script.js"></script>
</body>
</html>
